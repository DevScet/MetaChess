<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MetaChess v2.18</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Manrope:wght@500;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#070b16;--fg:#e8eef8;--card:rgba(16,24,48,.82);--l:#3d5a80;--d:#1a2744;--sel:#7dd3fc;--go:#34d399;--acc:#6366f1;--acc2:#a78bfa;--line:rgba(148,163,255,.22);--glow:rgba(99,102,241,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light;--bg:#e8eef8;--fg:#0f172a;--card:rgba(255,255,255,.9);--l:#c7d2fe;--d:#64748b;--sel:#0ea5e9;--go:#059669;--acc:#4f46e5;--acc2:#7c3aed;--line:rgba(79,70,229,.2);--glow:rgba(79,70,229,.25)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
body{margin:0;color:var(--fg);font:500 16px/1.45 "DM Sans",system-ui,sans-serif;
 background:
  radial-gradient(ellipse 120% 80% at 10% -10%, rgba(99,102,241,.35) 0%, transparent 50%),
  radial-gradient(ellipse 90% 60% at 100% 0%, rgba(167,139,250,.22) 0%, transparent 45%),
  radial-gradient(ellipse 70% 50% at 50% 100%, rgba(14,165,233,.12) 0%, transparent 40%),
  radial-gradient(circle at 20% 40%, rgba(255,255,255,.04) 0 1px, transparent 1.5px),
  radial-gradient(circle at 70% 20%, rgba(255,255,255,.035) 0 1px, transparent 1.5px),
  radial-gradient(circle at 40% 80%, rgba(255,255,255,.03) 0 1px, transparent 1.5px),
  radial-gradient(circle at 85% 60%, rgba(255,255,255,.04) 0 1px, transparent 1.5px),
  var(--bg);
 background-attachment:fixed;min-height:100dvh}
main{max-width:560px;margin:auto;padding:10px 14px 40px;position:relative}
h1{font-size:22px;font-weight:800;margin:4px 0 12px;letter-spacing:.02em;
 background:linear-gradient(105deg,#e0e7ff 0%,#a5b4fc 40%,#c4b5fd 70%,#7dd3fc 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{background:none;-webkit-background-clip:unset;background-clip:unset;color:var(--fg);opacity:.55}
[hidden]{display:none!important}

#topbar{position:sticky;top:0;z-index:50;padding:10px 12px 8px;margin:0;
 background:rgba(7,11,22,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-bottom:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.35)}
#topbar h1{margin:0 0 8px;font-size:20px;font-family:Manrope,system-ui,sans-serif}
#topbar #tabs{margin:0;font-family:Manrope,system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:10px 14px 40px;position:relative}
#bdwrap{width:100%;display:flex;justify-content:center;align-items:flex-start;
 padding:4px max(12px, env(safe-area-inset-left)) 8px max(12px, env(safe-area-inset-right));
 box-sizing:border-box;overflow-x:auto;-webkit-overflow-scrolling:touch}
#bd{width:min(100%,92vw,min(480px,62dvh))!important;max-width:calc(100vw - 28px)!important;
 max-height:min(62dvh,92vw)!important;aspect-ratio:1;height:auto;margin:0 auto;
 flex:0 0 auto;box-sizing:border-box}

/* кнопки — не все одинаковые */
button,.btn{font:inherit;font-size:14px;padding:8px 12px;border-radius:11px;border:1px solid var(--line);
 background:linear-gradient(165deg,rgba(36,48,82,.95),rgba(14,20,40,.92));color:var(--fg);cursor:pointer;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 10px rgba(0,0,0,.22);
 transition:border-color .15s,box-shadow .15s,transform .12s,background .15s}
button:active,.btn:active{transform:scale(.97)}
button.on,.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;
 box-shadow:0 0 18px var(--glow),inset 0 1px 0 rgba(255,255,255,.2)}
#tabs{background:rgba(12,18,36,.55);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;flex-wrap:nowrap;
 box-shadow:inset 0 0 0 1px rgba(99,102,241,.08)}
#tabs button{flex:1;border:none;background:transparent;color:var(--fg);padding:9px 4px;font-weight:800;border-radius:11px;font-size:20px;line-height:1;
 box-shadow:none}
#tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 0 14px var(--glow)}
.chip{border-radius:999px;padding:5px 14px;font-size:13px;background:rgba(99,102,241,.12);border-color:rgba(148,163,255,.3)}
.row > button:not(.on):nth-child(odd){border-color:rgba(167,139,250,.28)}
.row > button:not(.on):nth-child(even){border-color:rgba(125,211,252,.22)}
button[data-a="new"],button[data-a="sv"],button[data-a="nethost"],button[data-a="netstart"],button[data-a="cget"]{
 border-radius:12px;font-weight:800;letter-spacing:.02em}
button[data-a="del"],button[data-a="clr"],button[data-a="netdisc"]{
 border-color:rgba(244,63,94,.35);background:linear-gradient(165deg,rgba(60,24,36,.9),rgba(20,12,18,.95))}
button[data-a="undo"],button[data-a="sundo"],button[data-a="eundo"]{border-radius:50%;min-width:40px;padding:8px}
.nv button{border-radius:12px;background:rgba(12,18,36,.7)}

/* чат: fab + dock */
#netfab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
 z-index:45;width:56px;height:56px;border-radius:18px;border:1px solid rgba(165,180,252,.35);
 background:linear-gradient(145deg,#4f46e5 0%,#7c3aed 55%,#6366f1 100%);color:#fff;
 box-shadow:0 8px 28px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.25);
 display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;
 transition:box-shadow .15s,transform .12s}
#netfab:active{cursor:grabbing;transform:scale(.96)}
#netfab svg{display:block;width:26px;height:26px;pointer-events:none}
#netfab .badge{position:absolute;top:-3px;right:-3px;background:#e11d48;color:#fff;font-size:11px;font-weight:800;
 min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;
 box-shadow:0 2px 6px rgba(0,0,0,.35)}
#netdock{position:fixed;right:max(10px,env(safe-area-inset-right));left:auto;
 bottom:max(10px,env(safe-area-inset-bottom));
 z-index:46;width:min(360px,calc(100vw - 20px));
 height:min(42dvh,360px);max-height:min(42dvh,360px);
 display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
 background:rgba(12,18,36,.94);border:1px solid rgba(148,163,255,.3);
 box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 40px rgba(99,102,241,.15);backdrop-filter:blur(16px);
 font-size:14px;
 transition:bottom .28s cubic-bezier(.22,.9,.3,1), height .28s cubic-bezier(.22,.9,.3,1), max-height .28s cubic-bezier(.22,.9,.3,1);
 will-change:bottom,height,max-height}
#netdock .net-head{flex:0 0 auto}
#netdock .net-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#netdock .net-input{flex:0 0 auto;flex-shrink:0!important}

button,.btn{font:inherit;font-size:15px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
#tabs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:nowrap}
#tabs button{flex:1;border:none;background:transparent;color:var(--fg);padding:8px 4px;font-weight:800;border-radius:10px;font-size:22px;line-height:1}
#tabs button.on{background:var(--acc);color:#fff}
.chip{border-radius:999px;padding:5px 12px;font-size:14px}
#st{margin:8px 0;font-weight:800}
#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(100%,92vw,min(480px,62dvh));max-width:calc(100vw - 28px);max-height:min(62dvh,92vw);aspect-ratio:1;margin:0 auto;border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bd.ed{touch-action:none}
.sq{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;font-weight:400}
.sq *{pointer-events:none}
.l{background:linear-gradient(145deg,color-mix(in srgb,var(--l) 82%,#fff) 0%,var(--l) 55%,color-mix(in srgb,var(--l) 75%,#1a1030) 100%)}
.d{background:linear-gradient(145deg,color-mix(in srgb,var(--d) 70%,#6b7cff) 0%,var(--d) 50%,color-mix(in srgb,var(--d) 55%,#000) 100%)}
.sq em{position:absolute;font:800 10px/1 Manrope,sans-serif;font-style:normal;z-index:6;pointer-events:none;
 text-shadow:0 0 3px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.6);opacity:.95}
.fl{left:3px;bottom:2px}.rk{right:3px;top:2px}
.fl2{right:3px;top:2px;transform:rotate(180deg)}.rk2{left:3px;bottom:2px;transform:rotate(180deg)}
.l em{color:rgba(255,255,255,.92)}.d em{color:rgba(255,255,255,.88)}
.sq .pc{z-index:1}
#bd{box-shadow:0 0 0 1px rgba(148,163,255,.18),0 12px 40px rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.12)}

/* board depth (DeepSeek-inspired) */
.sq{border:1px solid rgba(255,255,255,.04);box-shadow:inset 0 1px 2px rgba(255,255,255,.04),inset 0 -1px 2px rgba(0,0,0,.12)}
#bd{position:relative;border-radius:12px;overflow:hidden;
 box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px rgba(139,92,246,.12),0 0 0 1px rgba(148,163,255,.2)}
#bd::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
 background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.22) 100%);border-radius:inherit}
.sq em{font-weight:600!important;font-size:9px!important;letter-spacing:.02em;
 color:color-mix(in srgb,var(--acc) 55%,#fff)!important;
 text-shadow:0 0 4px color-mix(in srgb,var(--acc) 40%,transparent),0 1px 2px rgba(0,0,0,.75)!important;
 opacity:.9}
.pc img{filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));transition:filter .15s,transform .15s}
.pc.w img,.pc.y img{filter:drop-shadow(0 0 2.5px rgba(167,139,250,.45)) drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.pc.b img,.pc.g img,.pc.r img{filter:drop-shadow(0 0 2.5px rgba(96,165,250,.35)) drop-shadow(0 2px 4px rgba(0,0,0,.75))}
.sel .pc img{filter:drop-shadow(0 0 6px rgba(125,211,252,.7)) drop-shadow(0 2px 4px rgba(0,0,0,.5));animation:piecePulse 1.4s ease-in-out infinite}
@keyframes piecePulse{0%,100%{filter:drop-shadow(0 0 4px rgba(125,211,252,.5)) drop-shadow(0 2px 4px rgba(0,0,0,.5))}50%{filter:drop-shadow(0 0 9px rgba(167,139,250,.85)) drop-shadow(0 2px 4px rgba(0,0,0,.5))}}
#netdock .net-x{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
 border-radius:8px;background:rgba(0,0,0,.28);font-size:14px;font-weight:700;line-height:1;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);flex-shrink:0}
#netdock .net-x:hover{background:rgba(0,0,0,.42)}

.lm{background-image:linear-gradient(rgba(240,200,30,.5),rgba(240,200,30,.5))}
.chk{background-image:radial-gradient(circle,#ff2a2a 0%,rgba(230,20,20,.7) 40%,rgba(230,20,20,0) 75%)}
.sel{box-shadow:inset 0 0 0 3px var(--sel);z-index:2}
.sel .pc{z-index:3;filter:none}
.sel .pc img{opacity:1;transform:none}
.sq.sel.portal-bg::before,.sq.sel.crystal-bg::before{opacity:.35}
.go::after{content:"";position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--go);opacity:.85}
.cap{box-shadow:inset 0 0 0 4px var(--go)}
.pc{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-style:normal}
.pc img{width:94%;height:94%;image-rendering:pixelated}
#bd.duo .pc.b img,#bd.duo .pc.g img,#bd.duo .pc.r img{transform:rotate(180deg)}
.pc{position:relative}
/* цвет сторон r/g/y рисуется в спрайте только по непрозрачным пикселям */
.sq.fogged{
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(30,42,58,.2) 0%, rgba(6,10,16,.78) 70%, rgba(4,8,12,.88) 100%),
    repeating-linear-gradient(-18deg, transparent 0 5px, rgba(255,255,255,.035) 5px 6px)!important;
  box-shadow:inset 0 0 18px rgba(0,0,0,.35);
}
.sq.fogged .pc{visibility:hidden}
.sq.fogged::before{
  content:"";position:absolute;inset:14%;border-radius:5px;
  background:rgba(18,26,36,.35);
  border:1px solid rgba(160,190,220,.12);
  box-shadow:inset 0 0 10px rgba(0,0,0,.35);
}
.sq{position:relative}
.sq.ducksq{box-shadow:inset 0 0 0 2px #f5c542;z-index:1}
.duck{font-size:clamp(14px,4.5vw,22px);line-height:1;position:relative;z-index:4;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));pointer-events:none}
.sq.duck-target{cursor:pointer}
.sq.duck-target::after{
 content:"";position:absolute;width:24%;aspect-ratio:1;border-radius:50%;
 background:#f5c542;opacity:.8;z-index:3;box-shadow:0 0 0 2px rgba(0,0,0,.2);
}
.sq.fogged.duck-target::after{opacity:.95}
.sq.fogged .duck{visibility:visible;z-index:4}

.sq.portal-bg::before{
 content:"";position:absolute;inset:10%;border-radius:50%;
 background:
  radial-gradient(circle at 35% 30%,rgba(180,220,255,.85) 0%,rgba(80,140,255,.35) 35%,rgba(40,60,180,.55) 70%,transparent 72%),
  conic-gradient(from 0deg,rgba(100,180,255,.5),rgba(60,100,220,.2),rgba(140,200,255,.55),rgba(60,100,220,.2),rgba(100,180,255,.5));
 box-shadow:0 0 10px rgba(80,140,255,.45),inset 0 0 8px rgba(200,230,255,.35);
 z-index:0;pointer-events:none;opacity:.9;
}
.sq.crystal-bg::before{
 content:"";position:absolute;inset:12%;
 background:
  linear-gradient(135deg,transparent 40%,rgba(200,240,255,.35) 50%,transparent 60%),
  linear-gradient(45deg,rgba(120,220,255,.15),rgba(180,100,255,.25));
 clip-path:polygon(50% 0%,80% 35%,65% 100%,35% 100%,20% 35%);
 box-shadow:0 0 12px rgba(140,200,255,.5);
 z-index:0;pointer-events:none;
}
.sq .pc{position:relative;z-index:1}
.sq.go::after{content:"";position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--go);opacity:.85;z-index:2}
.sq.go-free::after{content:"";position:absolute;width:28%;aspect-ratio:1;border-radius:2px;background:#e67e22;opacity:.9;transform:rotate(45deg);z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sq.cap-free{box-shadow:inset 0 0 0 4px #e67e22}
.hand{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.hand button{padding:4px 8px;min-width:0}
.hand .on{outline:2px solid var(--sel)}
.sq.fogged.fog-edge{
  background-image:
    radial-gradient(ellipse at 50% 50%, rgba(40,55,75,.15) 0%, rgba(10,16,24,.55) 100%)!important;
}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin:10px 0}
.pal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;min-width:0;overflow:hidden}
.pal small{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:11px;line-height:1.2}
.pal .pc,.li .pc{width:44px;height:44px;flex-shrink:0}
.li{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap;min-width:0}
.li span{flex:1 1 80px;margin-left:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .row, .li > button{flex:0 0 auto}
.board-list .li, .pack-card .li{max-width:100%}
.board-list button, .li button{max-width:100%;box-sizing:border-box}

.grid{display:grid;grid-template-columns:repeat(7,22px);grid-auto-rows:22px;gap:2px;width:max-content;margin:10px auto;justify-content:center}
.grid.moves{
 display:grid!important;
 gap:2px!important;
 width:max-content!important;
 max-width:none!important;
 margin:8px auto!important;
 justify-content:start!important;
 align-content:start!important;
 flex:none!important;
}
.grid.moves .gc, #gr .gc, #gh .gc{
 width:var(--gc,22px)!important;
 height:var(--gc,22px)!important;
 min-width:var(--gc,22px)!important;
 min-height:var(--gc,22px)!important;
 max-width:var(--gc,22px)!important;
 max-height:var(--gc,22px)!important;
 box-sizing:border-box!important;
 display:flex!important;
 align-items:center!important;
 justify-content:center!important;
 background:var(--card);
 border:1px solid var(--line);
 border-radius:3px!important;
 font-weight:800;
 cursor:pointer;
 font-size:10px!important;
 line-height:1!important;
 padding:0!important;
 margin:0!important;
 flex:none!important;
 aspect-ratio:1/1!important;
 overflow:hidden!important;
}
.gc{width:22px;height:22px;min-width:22px;min-height:22px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:5px;font-weight:800;cursor:pointer;font-size:11px;padding:0;line-height:1}
#grwrap,#ghwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-width:100%;width:100%;max-height:min(72vw,380px);touch-action:pan-x pan-y;overscroll-behavior:contain}
.gc.on{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important}
.gc.c{background:var(--d)!important;cursor:default}
.px{grid-template-columns:repeat(16,1fr);gap:0;width:min(100%,336px);touch-action:none;user-select:none;-webkit-user-select:none;background:var(--l);border:1px solid var(--line)}
.pxc{aspect-ratio:1;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.3)}
.sw{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;background:var(--card)}
.sw.s{outline:3px solid var(--sel)}
button.bp, .bp{width:40px;height:40px;min-width:40px;padding:0!important;border:none!important;border-radius:12px!important;
 overflow:hidden;box-shadow:0 0 0 2px rgba(148,163,255,.28),0 4px 14px rgba(0,0,0,.3);
 background-clip:padding-box;position:relative;flex:0 0 auto;background-color:transparent}
button.bp.on, .bp.on, button.bp:focus{box-shadow:0 0 0 2.5px var(--acc),0 0 18px var(--glow)}
button.bp-check, .bp-check{
 background-size:50% 50%!important;
 background-position:0 0, 100% 0, 0 100%, 100% 100%!important;
 background-repeat:no-repeat!important}
input[type=color].swatch{
 -webkit-appearance:none;appearance:none;width:40px;height:40px;min-width:40px;padding:0;border:none;
 border-radius:12px;cursor:pointer;background:transparent;flex:0 0 auto;
 box-shadow:0 0 0 2px rgba(148,163,255,.28),0 4px 14px rgba(0,0,0,.25);
 overflow:hidden}
input[type=color].swatch::-webkit-color-swatch-wrapper{padding:0;border:none;border-radius:12px}
input[type=color].swatch::-webkit-color-swatch{border:none;border-radius:10px}
input[type=color].swatch::-moz-color-swatch{border:none;border-radius:10px}
.swatch-wrap{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.swatch-wrap .sw-lab{font-size:11px;opacity:.7;margin:0 2px 0 4px}

.mini-bd{width:36px!important;height:36px!important;min-width:36px!important;max-width:36px!important;
 display:inline-grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;
 padding:3px;border-radius:8px;background:rgba(148,163,255,.12);flex:0 0 36px!important;box-sizing:border-box;
 box-shadow:0 0 0 1px rgba(148,163,255,.25);aspect-ratio:1/1;overflow:hidden}
.mini-bd i{display:block;border-radius:2px;min-width:0;min-height:0;aspect-ratio:1/1}
.mini-bd i:nth-child(1),.mini-bd i:nth-child(4){background:var(--l)}
.mini-bd i:nth-child(2),.mini-bd i:nth-child(3){background:var(--d)}
#netfab.edge-hide{opacity:.4}
#netfab.edge-hide.edge-right{transform:translateX(62%)}
#netfab.edge-hide.edge-left{transform:translateX(-62%)}
#netfab{transition:left .35s cubic-bezier(.22,.9,.3,1),opacity .35s ease,transform .35s cubic-bezier(.22,.9,.3,1),box-shadow .15s}


/* color picker popover */
#colorpop{
 position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
 background:rgba(4,8,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

 g:{lo:[0.08,0.18,0.55],hi:[0.25,0.45,0.95]}, /* королевский синий */

const cache={},spr=(t,c)=>{const d=P[t],side=(COL_META[c]&&COL_META[c].sprite==='b')?'b':'w',s=side=='w'?d.sw:d.sb;return /^\.*$/.test(s)?d.sw||d.sb:s};
const url=(s,tintKey)=>{
 const key=s+'|'+(tintKey||'');
 return cache[key]||(cache[key]=(()=>{
  const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
  const tint=tintKey&&TINT_RGB[tintKey];
  for(let i=0;i<256;i++){
   if(s[i]==='.')continue;
   let col=PAL[parseInt(s[i],16)];
   if(tint){
    const R=parseInt(col.slice(1,3),16),G=parseInt(col.slice(3,5),16),B=parseInt(col.slice(5,7),16);
    const lum=Math.min(1,Math.max(0,(0.3*R+0.5*G+0.2*B)/255));
    /* тёмные пиксели → lo (контур/тень), светлые → hi (заливка) — как на схеме */
    const t=tint.lo.map((lo,j)=>lo*(1-lum)+tint.hi[j]*lum);
    const nr=Math.min(255,Math.round(t[0]*255));
    const ng=Math.min(255,Math.round(t[1]*255));
    const nb=Math.min(255,Math.round(t[2]*255));
    col='#'+((1<<24)|(nr<<16)|(ng<<8)|nb).toString(16).slice(1);
   }
   x.fillStyle=col;x.fillRect(i%16,i>>4,1,1);
  }
  return c.toDataURL('image/png');
 })());
};

function chess960(){
 const b=empty();
 const back=['r','n','b','q','k','b','n','r'];
 // simple shuffle keeping bishops opposite colors and king between rooks (simplified)
 const pos=[0,1,2,3,4,5,6,7];
 for(let i=pos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]]}
 const T=pos.map(i=>back[i]);
 // ensure king has rooks on both sides (basic)
 let ki=T.indexOf('k'),ri=T.indexOf('r'),rj=T.lastIndexOf('r');
 if(ri>ki||rj<ki){T[ki]='r';T[4]='k';} // fallback
 for(let c=0;c<8;c++){b[0][c]={t:T[c],c:'b'};b[1][c]={t:'p',c:'b'};b[6][c]={t:'p',c:'w'};b[7][c]={t:T[c],c:'w'}}
 return b;
}
function hordeSetup(){

function makeAISprite(motif){
 const rows=[0,0,2,4,6,7,8,8,8,8,8,7,6,5,0,0],g=Array(256).fill('.');
 const put=(x,y,ch)=>{if(x>=0&&x<16&&y>=0&&y<16)g[y*16+x]=ch};
 for(let y=2;y<=13;y++){const w=rows[y],left=8-w;for(let x=left;x<=8+w;x++){put(x,y,'2');if(x==left||x==8+w)put(x,y,'0')}}
 // голова и детали силуэта
 for(let y=1;y<=5;y++)for(let x=5;x<=10;x++)put(x,y,(x==5||x==10||y==1)?'0':'2');
 for(let x=4;x<=5;x++)put(x,2,'0');for(let x=10;x<=11;x++)put(x,2,'0');
 for(let x=5;x<=6;x++)put(x,4,'3');for(let x=9;x<=10;x++)put(x,4,'3');
 for(let y=11;y<=14;y++){put(5,y,'0');put(6,y,'2');put(9,y,'0');put(10,y,'2')}
 if(motif=='stripes'){for(let y=3;y<12;y+=2)for(let x=3+(y%3);x<13;x+=3)put(x,y,'3')}
 else if(motif=='spots'){[[4,7],[11,8],[6,10],[10,5],[3,9],[12,6]].forEach(([x,y])=>put(x,y,'3'))}
 else if(motif=='flame'){for(let y=2;y<7;y++)for(let x=6;x<10;x++)if((x+y)%3==0)put(x,y,'3')}
 else if(motif=='crystal'){for(let y=0;y<5;y++)for(let x=5;x<11;x++)if(Math.abs(x-8)<=y+1)put(x,y,'3')}
 else if(motif=='crown'){for(let x=4;x<=11;x++)put(x,1,'3');[4,6,9,11].forEach(x=>put(x,0,'3'))}
 else if(motif=='robot'){for(let x=6;x<=9;x++)put(x,3,'3');put(6,4,'3');put(9,4,'3')}
 else if(motif=='wing'){for(let y=4;y<9;y++){put(2+y%2,y,'3');put(13-y%2,y,'3')}}
 const white=g.join(''),black=[...white].map(c=>c=='2'?'5':c=='3'?'6':c=='1'?'4':c).join('');
 return{sw:white,sb:black};
}
async function estimatePieceValue(){
 const st=$('#aiValStatus');
 if(!S.ai.url||!S.ai.model){if(st)st.textContent='Сначала настрой API в настройках';return}

 const flags=[];
 if(E.jump)flags.push('прыжок через всех');if(E.jumpOwn)flags.push('прыжок через своих');
 if(E.pw)flags.push('как пешка');
 if(E.royal)flags.push('королевская');
 if(E.rookish)flags.push('ладейная');
 if(E.sitEat)flags.push('есть с места');
 if(E.fixed)flags.push('неподвижная');
 if(E.immortal)flags.push('бессмертная');
 if(+E.lives>0)flags.push('жизней '+E.lives);
 if(E.ability&&E.ability!=='none')flags.push(E.ability);
 const sys='Ты оцениваешь ценность шахматной фигуры в очках, как у пешки=1, коня/слона=3, ладьи=5, ферзя=9, короля=0. Ответь ТОЛЬКО JSON: {"value":число от 0 до 30,"reason":"кратко по-русски"}.';
 const user='Фигура «'+(E.name||'без имени')+'». Ходы: '+(moves.join(', ')||'нет')+'. '+(caps.length?'Отдельные взятия: '+caps.join(', ')+'. ':'')+'Свойства: '+(flags.join(', ')||'обычные')+'. Текущая оценка пользователя: '+(E.val??'?')+'.';

 if(t==null){if(st)st.textContent='Ошибка: '+(AI_LAST_ERROR||'нет ответа');return}
 let j=null;try{j=JSON.parse(t.match(/\{[\s\S]*\}/)?.[0]||t)}catch(e){}
 if(!j||j.value==null){if(st)st.textContent='Не удалось разобрать ответ';return}
 const val=Math.max(0,Math.min(99,Math.round(+j.value)||0));
 E.val=val;

}

/* ===== Онлайн: комната, места, 2–4 игрока, чат (PeerJS) ===== */
let NET={
 peer:null, role:null, room:'', status:'',
 conns:[],
 seats:{},
 myName:'Игрок',
 myColor:null,
 lobby:1,
 chat:[],
 dockOpen:0,
 unread:0,
 avatars:{}
};
const PEER_SERVERS=[
 {host:'0.peerjs.com',port:443,path:'/',secure:true},
 {host:'0.peerjs.com',port:443,path:'/peerjs',secure:true},
 {} /* встроенный дефолт PeerJS */
];
function peerConfig(server){
 return {
  ...server,
  config:{iceServers:[
   {urls:'stun:stun.l.google.com:19302'},
   {urls:'stun:stun1.l.google.com:19302'},
   {urls:'stun:stun.cloudflare.com:3478'}
  ]},
  debug:1
 };
}
function netMyId(){return NET.peer&&NET.peer.id}
function netIsHost(){return NET.role==='host'}
function netConnected(){return NET.conns.some(c=>c.conn&&c.conn.open)||(NET.peer&&NET.role)}
function netBroadcast(msg,except){
 NET.conns.forEach(c=>{
  if(!c.conn||!c.conn.open)return;
  if(except&&c.peerId===except)return;
  try{c.conn.send(msg)}catch(e){}
 });
}
let _netStateT=null,_netStateBusy=0;
function netSendState(){
 /* в лобби полный пакет не шлём — только при партии; debounce от лагов */
 if(NET.lobby)return;
 if(_netStateT)clearTimeout(_netStateT);
 _netStateT=setTimeout(()=>{
  if(_netStateBusy)return;
  _netStateBusy=1;
  try{
   const msg={
    type:'state',
    pack:pack(),
    seats:NET.seats,
    lobby:NET.lobby,
    hostId:netIsHost()?netMyId():undefined
   };
   if(netIsHost())netBroadcast(msg);
   else{
    const host=NET.conns[0];
    if(host&&host.conn&&host.conn.open)try{host.conn.send(msg)}catch(e){}
   }
  }finally{_netStateBusy=0}
 },120);
}
function netApplySeatsToCtl(){
 const pl=playersList();
 S.ctl={};
 pl.forEach(c=>{
  const s=NET.seats[c];
  if(s&&s.peerId===netMyId())S.ctl[c]='h';
  else if(s)S.ctl[c]='net'; /* живой игрок по сети — ждём его ход, бот не ходит */
  else S.ctl[c]='lock'; /* пустое место — блокировка, не бот */
 });
}
function netApply(msg,fromPeerId){
 if(!msg||typeof msg!=='object')return;
 if(msg.type==='hello'){
  const row=NET.conns.find(c=>c.peerId===fromPeerId);
  if(row){row.name=msg.name||'Игрок';row.color=msg.color||null;row.av=msg.av||null}
  if(msg.av&&fromPeerId){NET.avatars=NET.avatars||{};NET.avatars[fromPeerId]=msg.av}
  if(msg.color&&playersList().includes(msg.color)){
   if(!NET.seats[msg.color]||NET.seats[msg.color].peerId===fromPeerId)
    NET.seats[msg.color]={peerId:fromPeerId,name:msg.name||'Игрок',av:msg.av||null};
  }
  /* ответить своим профилем */
  try{
   const back={type:'profile',name:NET.myName,av:myAvData(),peerId:netMyId()};
   const c=NET.conns.find(x=>x.peerId===fromPeerId);
   if(c&&c.conn)c.conn.send(back);
  }catch(e){}
  if(netIsHost()){netBroadcast({type:'lobby',seats:NET.seats,lobby:NET.lobby,room:NET.room});if(!NET.lobby)netSendState()}
  render();return;
 }
 if(msg.type==='lobby'){
  NET.seats=msg.seats||NET.seats;
  if(msg.lobby!=null)NET.lobby=msg.lobby;
  netApplySeatsToCtl();
  const mine=playersList().find(c=>NET.seats[c]&&NET.seats[c].peerId===netMyId());
  if(mine)orientForColor(mine);
  render();return;
 }
 if(msg.type==='claim'){
  if(!netIsHost())return;
  const col=msg.color,pid=fromPeerId;
  if(!playersList().includes(col))return;
  /* освободить прошлый цвет этого игрока */
  Object.keys(NET.seats).forEach(k=>{if(NET.seats[k]&&NET.seats[k].peerId===pid)delete NET.seats[k]});
  if(NET.seats[col]&&NET.seats[col].peerId!==pid){
   /* занято */ 
   const row=NET.conns.find(c=>c.peerId===pid);
   if(row&&row.conn)try{row.conn.send({type:'chat',text:'Место '+colName(col)+' занято',sys:1})}catch(e){}
   return;
  }
  NET.seats[col]={peerId:pid,name:msg.name||'Игрок',av:msg.av||null};
  if(msg.av){NET.avatars=NET.avatars||{};NET.avatars[pid]=msg.av}
  if(pid===netMyId())orientForColor(col);
  netBroadcast({type:'lobby',seats:NET.seats,lobby:NET.lobby});
  render();return;
 }
 if(msg.type==='start'){
  NET.lobby=0;
  if(msg.pack)try{unpack(msg.pack,{fromNet:1})}catch(e){}
  NET.seats=msg.seats||NET.seats;
  netApplySeatsToCtl();
  const mine=playersList().find(c=>NET.seats[c]&&NET.seats[c].peerId===netMyId());
  if(mine)orientForColor(mine);
  NET.status='Игра началась';
  render();return;
 }
 if(msg.type==='state'&&msg.pack){
  try{
   const seats=msg.seats||NET.seats;
   const lobby=msg.lobby!=null?msg.lobby:NET.lobby;
   unpack(msg.pack,{fromNet:1});
   NET.seats=seats;NET.lobby=lobby;
   netApplySeatsToCtl();
   NET.status=(NET.lobby?'Лобби':'Игра')+' · ход '+colName(turn);
   render();
   /* хост ретранслирует гостям */
   if(netIsHost()&&fromPeerId)netBroadcast(msg,fromPeerId);
  }catch(e){NET.status='Ошибка синхронизации'}
  return;
 }
 if(msg.type==='chat'&&msg.text){
  if(msg.av&&msg.peerId){NET.avatars=NET.avatars||{};NET.avatars[msg.peerId]=msg.av}
  const line={who:msg.sys?'sys':(msg.peerId===netMyId()?'me':'peer'),name:msg.name||'',text:String(msg.text).slice(0,300),ts:Date.now(),av:msg.av||null,peerId:msg.peerId||fromPeerId};
  NET.chat.push(line);if(NET.chat.length>100)NET.chat.shift();
  NET.unread=(NET.unread||0)+(line.who==='me'?0:1);
  netPaintChat(true);
  if(netIsHost()&&fromPeerId)netBroadcast({...msg,peerId:fromPeerId},fromPeerId);
  return;
 }
 if(msg.type==='profile'){
  if(msg.av&&fromPeerId){NET.avatars=NET.avatars||{};NET.avatars[fromPeerId]=msg.av}
  const row=NET.conns.find(c=>c.peerId===fromPeerId);
  if(row&&msg.name)row.name=msg.name;
  if(netIsHost()&&fromPeerId)netBroadcast({type:'profile',name:msg.name,av:msg.av,peerId:fromPeerId},fromPeerId);
  netPaintChat(false);
  render();
  return;
 }
}
function netBind(conn,asHost){
 const peerId=conn.peer;
 const row={conn,peerId,name:'Игрок',color:null};
 NET.conns=NET.conns.filter(c=>c.peerId!==peerId);
 NET.conns.push(row);
 conn.on('data',d=>netApply(d,peerId));
 conn.on('close',()=>{
  NET.conns=NET.conns.filter(c=>c.peerId!==peerId);
  Object.keys(NET.seats).forEach(k=>{if(NET.seats[k]&&NET.seats[k].peerId===peerId)delete NET.seats[k]});
  NET.status='Игрок отключился';
  if(netIsHost())netBroadcast({type:'lobby',seats:NET.seats,lobby:NET.lobby});
  render();
 });
 conn.on('error',e=>{NET.status='Ошибка канала: '+(e&&e.type||e);render()});
 if(asHost){
  NET.status='Игрок подключился ('+NET.conns.length+')';
  conn.send({type:'lobby',seats:NET.seats,lobby:NET.lobby,room:NET.room});
  setTimeout(()=>netSendState(),300);
 }else{
  NET.status='На связи с хостом';
  conn.send({type:'hello',name:NET.myName,color:NET.myColor,av:myAvData()});
 }
 render();
}
function netCreatePeer(serverIdx,onReady,preferId){
 if(typeof Peer==='undefined'){NET.status='PeerJS не в файле';render();return}
 if(NET.peer){try{NET.peer.destroy()}catch(e){}NET.peer=null}
 const srv=PEER_SERVERS[serverIdx]||{};
 NET.status='Подключение к серверу '+(srv.host||'default')+'…';render();
 let p;
 try{p=preferId?new Peer(preferId,peerConfig(srv)):new Peer(peerConfig(srv))}catch(e){NET.status='Не удалось создать Peer: '+e;render();return}
 NET.peer=p;
 const fail=e=>{
  const t=(e&&e.type)||String(e);
  /* id занят / недоступен — создаём новый без preferId */
  if(preferId&&(t==='unavailable-id'||t==='invalid-id'||t==='peer-unavailable')){
   NET.status='Старый код занят — создаю новый…';
   setTimeout(()=>netCreatePeer(serverIdx,onReady,null),400);
   return;
  }
  NET.status='Peer error: '+t;
  if(serverIdx+1<PEER_SERVERS.length){
   NET.status+=' — пробую другой сервер…';
   setTimeout(()=>netCreatePeer(serverIdx+1,onReady,preferId),500);
  }else{
   NET.status='Все сигнальные серверы недоступны (VPN/WebView/сеть). Используй «Получить ссылку» или отключи VPN.';
   render();
  }
 };
 p.on('error',fail);
 p.on('open',id=>{NET.room=id;try{sessionStorage.setItem('netRoom',id)}catch(e){}NET.status='Комната готова';onReady&&onReady(id);render()});
}
function netHost(){
 NET.role='host';NET.conns=[];NET.seats={};NET.lobby=1;NET.chat=NET.chat||[];NET.myColor=null;NET.dockOpen=1;NET.unread=0;
 let prefer=null;
 try{prefer=sessionStorage.getItem('netRoom')||null}catch(e){}
 if(prefer&&!confirm('Попробовать снова открыть комнату с прошлым кодом?\n\n'+prefer+'\n\nОк — тот же код (если свободен). Отмена — новый код.'))prefer=null;
 netCreatePeer(0,id=>{
  NET.status='Код: '+id+' — отправь друзьям. Выбери цвет и «Начать игру».';
  NET.peer.on('connection',c=>{
   c.on('open',()=>netBind(c,true));
  });
 },prefer);
}
function netJoin(code){
 code=(code||'').trim();if(!code){alert('Введи код комнаты');return}
 NET.role='guest';NET.conns=[];NET.seats={};NET.lobby=1;NET.chat=NET.chat||[];NET.myColor=null;NET.room=code;NET.dockOpen=1;NET.unread=0;
 netCreatePeer(0,()=>{
  const c=NET.peer.connect(code,{reliable:true});
  c.on('open',()=>netBind(c,false));
  c.on('error',e=>{NET.status='Не удалось войти: '+(e&&e.type||e);render()});
 });
}
function orientForColor(color){
 /* свой цвет «ко мне»: белые/красные/жёлтые снизу (flip=0), чёрные/синие снизу (flip=1) */
 S.flip=(color==='b'||color==='g')?1:0;
}
function netClaim(color){
 if(!playersList().includes(color))return;
 syncNetName();
 NET.myColor=color;
 orientForColor(color);
 if(netIsHost()){
  Object.keys(NET.seats).forEach(k=>{if(NET.seats[k]&&NET.seats[k].peerId===netMyId())delete NET.seats[k]});
  NET.seats[color]={peerId:netMyId(),name:NET.myName,av:myAvData()};
  netApplySeatsToCtl();
  netBroadcast({type:'lobby',seats:NET.seats,lobby:NET.lobby});
  render();
 }else{
  const host=NET.conns[0];
  if(host&&host.conn)host.conn.send({type:'claim',color,name:NET.myName,av:myAvData()});
  render();
 }
}
function netStartGame(){
 if(!netIsHost())return;
 /* если хост не выбрал цвет — занять первый свободный */
 if(!Object.values(NET.seats||{}).some(s=>s&&s.peerId===netMyId())){
  const free=playersList().find(c=>!NET.seats[c]);
  if(free){NET.seats[free]={peerId:netMyId(),name:syncNetName()}}
 }
 NET.lobby=0;
 netApplySeatsToCtl();
 const myCols=playersList().filter(c=>NET.seats[c]&&NET.seats[c].peerId===netMyId());
 if(myCols[0])orientForColor(myCols[0]);
 const msg={type:'start',pack:pack(),seats:NET.seats,lobby:0};
 netBroadcast(msg);
 NET.status='Игра началась · ты ходишь за '+(myCols.map(colName).join(', ')||'?');
 render();
}
function netDisconnect(hard){

 NET.conns.forEach(c=>{try{c.conn.close()}catch(e){}});
 try{if(NET.peer)NET.peer.destroy()}catch(e){}
 NET={peer:null,role:null,room:hard?'':keepRoom,status:hard?'':'Вышли из комнаты. Код сохранён — можно войти снова.',conns:[],seats:{},myName:keepName,myColor:null,lobby:1,chat:keepChat,dock:NET.dock,avatars:{}};
 playersList().forEach(c=>{if(S.ctl[c]==='net'||S.ctl[c]==='lock')S.ctl[c]='h'});
 linkPlay=0;
 try{sessionStorage.setItem('netName',keepName);if(keepRoom&&!hard)sessionStorage.setItem('netRoom',keepRoom)}catch(e){}

function syncNetName(){

 if(nm){const v=(nm.value||'').trim();if(v)NET.myName=v.slice(0,20)}
 if(!NET.myName)NET.myName='Игрок';

}
function netChatSend(text){

 if(netIsHost())netBroadcast(msg);
 else if(NET.conns[0]&&NET.conns[0].conn)NET.conns[0].conn.send(msg);
 /* если чат с ИИ включён — дублируем вопрос нейросети */

 }else netPaintChat(true);
 const inp=document.getElementById('netchatin');

}
function netPaintChat(stickBottom){

 if(!body)return;

 /* общий поток: сеть + локальный CHAT */

 (CHAT.log||[]).forEach(m=>{

 });
 merged.sort((a,b)=>(a.ts||0)-(b.ts||0));
 const html=merged.slice(-80).map(m=>{

 }).join('');
 body.innerHTML=html||'<div class="nb sys"><div class="bubble">Общий чат: пиши людям в комнате и нейросети</div></div>';
 if(stickBottom||nearBottom)body.scrollTop=body.scrollHeight;
 const badge=document.querySelector('#netfab .badge');
 if(badge){const u=NET.unread||0;badge.hidden=!u;badge.textContent=u>9?'9+':String(u)}
}

 if(fab&&!NET.dockOpen){

const ANTH={brilliant:-80,best:15,good:40,inacc:90,mistake:180}; /* blunder > mistake */
const sqName=(r,c)=>(COLS_LETTERS[c]||'?')+(BH()-r);
function anBest(X,col,depth,timeMs){
 const real=ep;let root=[];
 X.forEach((row,r)=>row.forEach((p,c)=>{if(p&&p.c==col){
  legal(r,c,X).forEach(([i,k])=>{
   const Y=sim(X,r,c,i,k);if(!inCheck(Y,col))root.push([r,c,i,k,X[i][k]?(P[X[i][k].t].val||0):0]);
  });
 }}));
 if(!root.length){ep=real;return{score:inCheck(X,col)?-99000:0,move:null}}
 root.sort((a,b)=>b[4]-a[4]);
 let bestM=root[0],bestS=-1e9;T0=performance.now();TL=timeMs||180;
 try{
  for(let d=1;d<=depth;d++){
   let curBest=-1e9;const sc=[];
   for(const m of root){
    if(performance.now()-T0>TL)throw 'T';
    const[a,b,r,c]=m;ep=epOf(X[a][b],a,r,c);
    const v=-search(sim(X,a,b,r,c),nextTurn(col),d-1,-1e9,-(curBest-5),1,col);
    sc.push([m,v]);if(v>curBest){curBest=v;bestM=m;bestS=v}
   }
   sc.sort((x,y)=>y[1]-x[1]);root=sc.map(x=>x[0]).slice(0,Math.max(6,root.length));
   if(curBest>90000)break;
  }
 }catch(e){if(e!='T'){ep=real;throw e}}

}
function classify(loss,isBest,scoreJump){
 /* scoreJump — изменение оценки с точки зрения ходившего (после − до) */
 if(isBest&&loss<=ANTH.best){
  /* Brilliant: лучший ход и сильный рост оценки (типичный «красивый» удар) */
  if(scoreJump>=120)return{tag:'!!',cls:'tag-!!',name:'Brilliant'};
  return{tag:'!',cls:'tag-!',name:'Best'};
 }
 if(loss<=ANTH.good)return{tag:'',cls:'tag-g',name:'Good'};
 if(loss<=ANTH.inacc)return{tag:'?!',cls:'tag-?!',name:'Inaccuracy'};
 if(loss<=ANTH.mistake)return{tag:'?',cls:'tag-?',name:'Mistake'};

}

function runAnalysis(){
 if(anBusy||REC.length<2)return;

 const total=REC.length-1;
 const step=i=>{
  if(anCancel){anBusy=0;renderAn();return}
  if(i>=total){anBusy=0;anIdx=total;load(REC.length-1);renderAn();return}
  /* позиция до хода i (REC[i] — после хода) */
  const before=JSON.parse(REC[i]);
  const after=JSON.parse(REC[i+1]);
  const X=before.b,col=before.turn;
  const last=after.last; /* [[fr,fc],[tr,tc]] */
  const played=last?[last[0][0],last[0][1],last[1][0],last[1][1]]:null;
  const scoreBefore=evaluatePosition(X,'w');
  /* лёгкий поиск лучшего хода */
  const depth=total>40?1:(total>20?2:2);
  const tLim=total>40?80:(total>20?120:160);
  let best={score:0,move:null};
  try{best=anBest(X,col,depth,tLim)}catch(e){best={score:evalPos(X,col),move:null}}
  /* оценка сыгранного хода */
  let playedScore=-1e9,isBest=0;
  if(played){
   const[a,b,r,c]=played;
   const Y=sim(X,a,b,r,c);
   /* score after move from the mover's perspective ≈ -eval of opponent */
   playedScore=evalPos(Y,col);
   if(best.move&&best.move[0]==a&&best.move[1]==b&&best.move[2]==r&&best.move[3]==c)isBest=1;
   /* loss: how much worse than best (from mover's view) */
  }
  const bestScore=best.score;
  const loss=isBest?0:Math.max(0,bestScore-playedScore);
  const scoreAfter=evaluatePosition(after.b,'w');
  /* изменение оценки с точки зрения ходившего */
  const jump=col=='w'?(scoreAfter-scoreBefore):(scoreBefore-scoreAfter);
  const cl=classify(loss,isBest||loss<=ANTH.best,jump);
  const piece=played&&X[played[0]]?X[played[0]][played[1]]:null;
  const capBefore=before.cap||{w:[],b:[]},capAfter=after.cap||{w:[],b:[]};
  const cap=(capAfter.w.length>capBefore.w.length)||(capAfter.b.length>capBefore.b.length);
  anData.push({
   i:i+1,col,played,best:best.move,scoreBefore,scoreAfter,bestScore,playedScore,loss,cl,
   label:anMoveLabel(played&&[played[0],played[1]],played&&[played[2],played[3]],piece,cap),
   bestLabel:best.move&&X[best.move[0]]?anMoveLabel([best.move[0],best.move[1]],[best.move[2],best.move[3]],X[best.move[0]][best.move[1]],!!(X[best.move[2]]&&X[best.move[2]][best.move[3]])):'—'
  });
  anIdx=i+1;
  renderAn();
  setTimeout(()=>step(i+1),0);
 };
 /* восстановить текущую позицию после анализа не нужно — load управляет */

}
